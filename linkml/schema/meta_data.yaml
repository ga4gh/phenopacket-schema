id: https://example.org/phenopacket-linkml/meta_data
name: meta_data
title: 'Phenopackets v2: phenopackets/schema/v2/core/meta_data.proto'
description: Curated from phenopackets/schema/v2/core/meta_data.proto. Generated by tooling/curate.py from reference/imported/meta_data.yaml,
  the evidence rules and curation/decisions/meta_data.yaml; do not edit.
license: BSD-3-Clause
annotations:
  proto_file: phenopackets/schema/v2/core/meta_data.proto
  proto_package: org.phenopackets.schema.v2.core
  proto_options: '{"java_multiple_files": true, "java_package": "org.phenopackets.schema.v2.core"}'
prefixes:
  linkml: https://w3id.org/linkml/
  phenopackets: https://example.org/phenopacket-linkml/
default_prefix: phenopackets
default_range: string
imports:
- linkml:types
- base
classes:
  MetaData:
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.MetaData
    attributes:
      created:
        rank: 1
        range: datetime
        description: ISO8601 UTC timestamp for when this phenopacket was created in ISO "2018-03-01T00:00:00Z"
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.MetaData.created
          proto_type: google.protobuf.Timestamp
        required: true
      created_by:
        alias: createdBy
        rank: 2
        range: string
        description: |-
          some kind of identifier for the contributor/ program
          ARGO sample_registration::program_id
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.MetaData.created_by
        required: true
        pattern: .
      submitted_by:
        alias: submittedBy
        rank: 3
        range: string
        description: information about the person/organisation/network that has submitted this phenopacket
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.MetaData.submitted_by
      resources:
        rank: 4
        range: Resource
        multivalued: true
        inlined_as_list: true
        description: a listing of the ontologies and resources referenced in the phenopacket
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.MetaData.resources
        minimum_cardinality: 1
      updates:
        rank: 5
        range: Update
        multivalued: true
        inlined_as_list: true
        description: An OPTIONAL list of Updates to the phenopacket.
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.MetaData.updates
      phenopacket_schema_version:
        alias: phenopacketSchemaVersion
        rank: 6
        range: string
        description: phenopacket-schema-version used to create this phenopacket
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.MetaData.phenopacket_schema_version
        required: true
        pattern: .
      external_references:
        alias: externalReferences
        rank: 7
        range: ExternalReference
        multivalued: true
        inlined_as_list: true
        description: |-
          External identifiers for this message. These are considered different representation of the same record, not
          records which are in some other relation with the record at hand. For example this might be a PubMed reference
          to a study in which the individuals are reported.
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.MetaData.external_references
  Resource:
    description: |-
      Description of an external resource used for referencing an object. For example the resource may be an ontology such
      as the HPO or SNOMED.
      FHIR mapping: CodeSystem (http://www.hl7.org/fhir/codesystem.html)
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.Resource
      fhir_mapping: CodeSystem (http://www.hl7.org/fhir/codesystem.html)
    attributes:
      id:
        rank: 1
        range: string
        description: |-
          for OBO Ontologies, the value of this string MUST always be the official
          OBO ID, which is always equivalent to the ID prefix in lower case.
          Examples: hp, go, mp, mondo
          Consult http://obofoundry.org for a complete list
          For other ontologies (e.g. SNOMED), use the prefix in identifiers.org
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Resource.id
        required: true
        pattern: .
      name:
        rank: 2
        range: string
        description: |-
          e.g. The Human Phenotype Ontology
          for OBO Ontologies, the value of this string SHOULD be the same as the title
          field on http://obofoundry.org
          however, this field is purely for information purposes and software
          should not encode any assumptions
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Resource.name
        required: true
        pattern: .
      url:
        rank: 3
        range: string
        description: |-
          For OBO ontologies, this should always be the PURL, e.g.
          http://purl.obolibrary.org/obo/hp.owl, http://purl.obolibrary.org/obo/hp.obo
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Resource.url
        required: true
        pattern: .
      version:
        rank: 4
        range: string
        description: for OBO ontologies, this should be the versionIRI
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Resource.version
        required: true
        pattern: .
      namespace_prefix:
        alias: namespacePrefix
        rank: 5
        range: string
        description: |-
          The prefix used in the CURIE of an OntologyClass e.g. HP, MP, ECO
          For example an HPO term will have a CURIE like this - HP:0012828 which should be used in combination with
          the iri_prefix to form a fully-resolvable IRI
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Resource.namespace_prefix
        required: true
        pattern: .
      iri_prefix:
        alias: iriPrefix
        rank: 6
        range: string
        description: |-
          Full IRI prefix which can be used with the namespace_prefix and the OntologyClass::id to resolve to an IRI for a
          term. Tools such as the curie-util (https://github.com/prefixcommons/curie-util) can utilise this to produce
          fully-resolvable IRIs for an OntologyClass.
          e.g. Using the HPO term encoding the concept of 'Severe'
          OntologyClass:
          id: 'HP:0012828'
          label: 'Severe'
          Resource:
          namespace_prefix: 'HP'
          iri_prefix: 'http://purl.obolibrary.org/obo/HP_'
          the term can be resolved to http://purl.obolibrary.org/obo/HP_0012828
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Resource.iri_prefix
        required: true
        pattern: .
  Update:
    description: |-
      Information about when an update to a record occurred, who or what made the update and any pertinent information
      regarding the content and/or reason for the update
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.Update
    attributes:
      timestamp:
        rank: 1
        range: datetime
        description: |-
          ISO8601 UTC timestamps at which this record was updated, in
          the format YYYY-MM-DDTHH:MM:SS.SSSZ e.g. 2007-12-03T10:15:30.00Z
          REQUIRED
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Update.timestamp
          proto_type: google.protobuf.Timestamp
        required: true
      updated_by:
        alias: updatedBy
        rank: 2
        range: string
        description: |-
          Information about the person/organisation/network that has updated the phenopacket.
          OPTIONAL
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Update.updated_by
      comment:
        rank: 3
        range: string
        description: |-
          Textual comment about the changes made to the content and/or reason for the update.
          OPTIONAL
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Update.comment
