id: https://example.org/phenopacket-linkml/base
name: base
title: 'Phenopackets v2: phenopackets/schema/v2/core/base.proto'
description: Curated from phenopackets/schema/v2/core/base.proto. Generated by tooling/curate.py from reference/imported/base.yaml,
  the evidence rules and curation/decisions/base.yaml; do not edit.
license: BSD-3-Clause
annotations:
  proto_file: phenopackets/schema/v2/core/base.proto
  proto_package: org.phenopackets.schema.v2.core
  proto_options: '{"java_multiple_files": true, "java_package": "org.phenopackets.schema.v2.core"}'
prefixes:
  linkml: https://w3id.org/linkml/
  phenopackets: https://example.org/phenopacket-linkml/
default_prefix: phenopackets
default_range: string
imports:
- linkml:types
classes:
  OntologyClass:
    description: |-
      A class (aka term, concept) in an ontology.
      FHIR mapping: CodeableConcept (http://www.hl7.org/fhir/datatypes.html#CodeableConcept)
      see also Coding (http://www.hl7.org/fhir/datatypes.html#Coding)
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.OntologyClass
      fhir_mapping: CodeableConcept (http://www.hl7.org/fhir/datatypes.html#CodeableConcept)
    attributes:
      id:
        rank: 1
        range: string
        description: |-
          a CURIE-style identifier e.g. HP:0100024, MP:0001284, UBERON:0001690.
          This is the primary key for the ontology class
          REQUIRED!
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.OntologyClass.id
        required: true
        pattern: .
      label:
        rank: 2
        range: string
        description: class label, aka name. E.g. "Abnormality of cardiovascular system"
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.OntologyClass.label
        pattern: .
        required: true
  ExternalReference:
    description: 'FHIR mapping: Reference (https://www.hl7.org/fhir/references.html)'
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.ExternalReference
      fhir_mapping: Reference (https://www.hl7.org/fhir/references.html)
    attributes:
      id:
        rank: 1
        range: string
        description: |-
          e.g. ISBN, PMID:123456, DOI:...,
          FHIR mapping: Reference.identifier
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.ExternalReference.id
          fhir_mapping: Reference.identifier
        recommended: true
      reference:
        rank: 2
        range: string
        description: |-
          A full or partial URL pointing to the external reference if no commonly resolvable identifier can be used in the
          `id` field
          FHIR mapping Reference.reference
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.ExternalReference.reference
          fhir_mapping: Reference.reference
        recommended: true
      description:
        rank: 3
        range: string
        description: |-
          Human readable title or display string for the reference
          FHIR mapping: Reference.display
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.ExternalReference.description
          fhir_mapping: Reference.display
  Evidence:
    description: 'FHIR mapping: Condition.evidence (https://www.hl7.org/fhir/condition-definitions.html#Condition.evidence)'
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.Evidence
      fhir_mapping: Condition.evidence (https://www.hl7.org/fhir/condition-definitions.html#Condition.evidence)
    attributes:
      evidence_code:
        alias: evidenceCode
        rank: 1
        range: OntologyClass
        description: |-
          The encoded evidence type using, for example the Evidence & Conclusion Ontology (ECO - http://purl.obolibrary.org/obo/eco.owl)
          FHIR mapping: Condition.evidence.code
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Evidence.evidence_code
          fhir_mapping: Condition.evidence.code
        required: true
      reference:
        rank: 2
        range: ExternalReference
        description: 'FHIR mapping: Condition.evidence.detail'
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Evidence.reference
          fhir_mapping: Condition.evidence.detail
  Procedure:
    description: |-
      A clinical procedure performed on a subject. By preference a single concept to indicate both the procedure and the
      body site should be used. In cases where this is not possible, the body site should be indicated using a separate
      ontology class.
      e.g.
      {"code":{"NCIT:C51585": "Biopsy of Soft Palate"}}
      {"code":{"NCIT:C28743": "Punch Biopsy"}, "body_site":{"UBERON:0003403": "skin of forearm"}} - a punch biopsy of the skin from the forearm
      FHIR mapping: Procedure (https://www.hl7.org/fhir/procedure.html)
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.Procedure
      fhir_mapping: Procedure (https://www.hl7.org/fhir/procedure.html)
    attributes:
      code:
        rank: 1
        range: OntologyClass
        description: 'FHIR mapping: Procedure.code'
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Procedure.code
          fhir_mapping: Procedure.code
        required: true
      body_site:
        alias: bodySite
        rank: 2
        range: OntologyClass
        description: 'FHIR mapping: Procedure.bodySite'
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Procedure.body_site
          fhir_mapping: Procedure.bodySite
      performed:
        rank: 3
        range: TimeElement
        description: When the procedure was performed.
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Procedure.performed
  GestationalAge:
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.GestationalAge
    attributes:
      weeks:
        rank: 1
        range: integer
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.GestationalAge.weeks
        required: true
        minimum_value: 0
      days:
        rank: 2
        range: integer
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.GestationalAge.days
        minimum_value: 0
        recommended: true
  Age:
    description: |-
      See http://build.fhir.org/datatypes and http://build.fhir.org/condition-definitions.html#Condition.onset_x_
      In FHIR this is represented as a UCUM measurement - http://unitsofmeasure.org/trac/
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.Age
    attributes:
      iso8601duration:
        rank: 1
        range: string
        description: |-
          The :ref:`ISO 8601<metadata_date_time>` age of this object as ISO8601
          duration or time intervals. e.g. P40Y10M05D)
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Age.iso8601duration
        pattern: ^P(?!$)(\d+Y)?(\d+M)?(\d+W)?(\d+D)?(T(?=\d+[HMS])(\d+H)?(\d+M)?(\d+S)?)?$
        required: true
  AgeRange:
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.AgeRange
    attributes:
      start:
        rank: 1
        range: Age
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.AgeRange.start
        required: true
      end:
        rank: 2
        range: Age
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.AgeRange.end
        required: true
  TimeInterval:
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.TimeInterval
    attributes:
      start:
        rank: 1
        range: datetime
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.TimeInterval.start
          proto_type: google.protobuf.Timestamp
        required: true
      end:
        rank: 2
        range: datetime
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.TimeInterval.end
          proto_type: google.protobuf.Timestamp
        required: true
  TimeElement:
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.TimeElement
    attributes:
      gestational_age:
        alias: gestationalAge
        rank: 6
        range: GestationalAge
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.TimeElement.gestational_age
          proto_oneof: element
      age:
        rank: 1
        range: Age
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.TimeElement.age
          proto_oneof: element
      age_range:
        alias: ageRange
        rank: 2
        range: AgeRange
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.TimeElement.age_range
          proto_oneof: element
      ontology_class:
        alias: ontologyClass
        rank: 3
        range: OntologyClass
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.TimeElement.ontology_class
          proto_oneof: element
      timestamp:
        rank: 4
        range: datetime
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.TimeElement.timestamp
          proto_type: google.protobuf.Timestamp
          proto_oneof: element
      interval:
        rank: 5
        range: TimeInterval
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.TimeElement.interval
          proto_oneof: element
    exactly_one_of:
    - slot_conditions:
        gestationalAge:
          required: true
    - slot_conditions:
        age:
          required: true
    - slot_conditions:
        ageRange:
          required: true
    - slot_conditions:
        ontologyClass:
          required: true
    - slot_conditions:
        timestamp:
          required: true
    - slot_conditions:
        interval:
          required: true
  File:
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.File
    attributes:
      uri:
        rank: 1
        range: string
        description: URI for the file e.g. file://data/genomes/file1.vcf.gz or https://opensnp.org/data/60.23andme-exome-vcf.231?1341012444
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.File.uri
        required: true
        pattern: .
      individual_to_file_identifiers:
        alias: individualToFileIdentifiers
        rank: 2
        range: FileIndividualToFileIdentifiersEntry
        multivalued: true
        inlined: true
        description: |-
          A map of identifiers mapping an individual to a sample in the file. The key values must correspond to the
          Individual::id for the individuals in the message, the values must map to the samples in the file.
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.File.individual_to_file_identifiers
        recommended: true
      file_attributes:
        alias: fileAttributes
        rank: 3
        range: FileFileAttributesEntry
        multivalued: true
        inlined: true
        description: |-
          Map of attributes describing the file. For example the File format or genome assembly would be defied here. For
          genomic data files there MUST be a 'genomeAssembly' key.
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.File.file_attributes
  FileIndividualToFileIdentifiersEntry:
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.File.IndividualToFileIdentifiersEntry
      proto_parent: File
      proto_name: IndividualToFileIdentifiersEntry
      proto_map_entry: true
    attributes:
      key:
        rank: 1
        range: string
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.File.IndividualToFileIdentifiersEntry.key
        identifier: true
      value:
        rank: 2
        range: string
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.File.IndividualToFileIdentifiersEntry.value
  FileFileAttributesEntry:
    annotations:
      proto_ref: org.phenopackets.schema.v2.core.File.FileAttributesEntry
      proto_parent: File
      proto_name: FileAttributesEntry
      proto_map_entry: true
    attributes:
      key:
        rank: 1
        range: string
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.File.FileAttributesEntry.key
        identifier: true
      value:
        rank: 2
        range: string
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.File.FileAttributesEntry.value
