id: https://example.org/phenopacket-linkml/phenopackets
name: phenopackets
title: 'Phenopackets v2: phenopackets/schema/v2/phenopackets.proto'
description: 'Trimmed for the proof of concept: only Phenopacket''s id, subject and meta_data. The full module also has Family,
  Cohort and Phenopacket''s other fields.'
license: BSD-3-Clause
annotations:
  proto_file: phenopackets/schema/v2/phenopackets.proto
  proto_package: org.phenopackets.schema.v2
  proto_options: '{"java_multiple_files": true, "java_package": "org.phenopackets.schema.v2"}'
prefixes:
  linkml: https://w3id.org/linkml/
  phenopackets: https://example.org/phenopacket-linkml/
default_prefix: phenopackets
default_range: string
imports:
- linkml:types
- base
- individual
- meta_data
classes:
  Phenopacket:
    description: |-
      An anonymous phenotypic description of an individual or biosample with potential genes of interest and/or diagnoses.
      This is a bundle of high-level concepts with no specifically defined relational concepts. It is expected that the
      resources sharing the phenopackets will define and enforce their own semantics and level of requirements for included
      fields.
    annotations:
      proto_ref: org.phenopackets.schema.v2.Phenopacket
    attributes:
      id:
        rank: 1
        range: string
        description: An identifier specific for this phenopacket.
        annotations:
          proto_ref: org.phenopackets.schema.v2.Phenopacket.id
        required: true
        pattern: .
      subject:
        rank: 2
        range: Individual
        description: The individual representing the focus of this packet - e.g. the proband in rare disease cases or cancer
          patient
        annotations:
          proto_ref: org.phenopackets.schema.v2.Phenopacket.subject
        recommended: true
      meta_data:
        alias: metaData
        rank: 11
        range: MetaData
        description: Structured definitions of the resources and ontologies used within the phenopacket. REQUIRED
        annotations:
          proto_ref: org.phenopackets.schema.v2.Phenopacket.meta_data
        required: true
    tree_root: true
