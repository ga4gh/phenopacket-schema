        recommended: true
      sex:
        rank: 6
        range: Sex
        description: |-
          The phenotypic sex of the individual
          ARGO mapping sample_registration::gender (this is complicated as ARGO only have male/female/other which maps to the phenopacket Sex field)
        annotations:
          proto_ref: org.phenopackets.schema.v2.core.Individual.sex
          argo_mapping: sample_registration::gender (this is complicated as ARGO only have male/female/other which maps to
